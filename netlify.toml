[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  # pnpm with corepack — keeps the same lockfile we use locally
  NODE_VERSION = "20"
  PNPM_VERSION = "10.33.2"
  # Next.js 16 + Turbopack telemetry off
  NEXT_TELEMETRY_DISABLED = "1"
  # NEXT_PUBLIC_* env vars are intentionally inlined into the browser bundle —
  # that's the whole point of the prefix. Both the Supabase URL and anon key
  # are designed to be public, so omit them from Netlify's secret scanner.
  # Without this, deploys fail with "Secrets scanning found secrets in build."
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY"

# Netlify auto-installs @netlify/plugin-nextjs when it detects Next.js, but
# declaring it explicitly avoids the auto-detect failing on the worktree.
[[plugins]]
  package = "@netlify/plugin-nextjs"
